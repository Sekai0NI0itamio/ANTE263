name: diag-anvil

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --warning-mode all || true
          echo "=== build tree ==="
          find build -name "*.jar" | head -n 50
          echo "=== mod jar contents ==="
          for j in build/libs/*.jar; do echo "-- $j"; jar tf "$j"; done
          echo "=== mixin json in jar ==="
          for j in build/libs/*.jar; do jar xf "$j" ante.mixins.json 2>/dev/null && cat ante.mixins.json; echo; done
          echo "=== find AnvilMenu in any jar ==="
          for j in $(find build .gradle -name "*.jar" 2>/dev/null); do if jar tf "$j" 2>/dev/null | grep -q "net/minecraft/world/inventory/AnvilMenu.class"; then echo "FOUND in $j"; fi; done
          echo "=== javap AnvilMenu createResult (patched jar) ==="
          for j in $(find build .gradle -name "*.jar" 2>/dev/null); do if jar tf "$j" 2>/dev/null | grep -q "net/minecraft/world/inventory/AnvilMenu.class"; then echo "--- $j ---"; javap -classpath "$j" -c -p net.minecraft.world.inventory.AnvilMenu 2>&1 | sed -n '/createResult/,/^$/p' | head -n 400; break; fi; done
          echo "=== javap AnvilScreen renderLabels ==="
          for j in $(find build .gradle -name "*.jar" 2>/dev/null); do if jar tf "$j" 2>/dev/null | grep -q "net/minecraft/client/gui/screens/inventory/AnvilScreen.class"; then echo "--- $j ---"; javap -classpath "$j" -c -p net.minecraft.client.gui.screens.inventory.AnvilScreen 2>&1 | head -n 400; break; fi; done
